services:
  - type: web
    name: telegram-youtube-publisher
    runtime: docker
    plan: starter

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATA_DIR
        value: /var/data

      - key: PORT
        value: "3000"

      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: TELEGRAM_ADMIN_ID
        sync: false

      - key: GOOGLE_CREDENTIALS_JSON
        sync: false

      - key: GOOGLE_REDIRECT_URI
        sync: false

      - key: APP_BASE_URL
        sync: false

    disk:
      name: youtube-data
      mountPath: /var/data
      sizeGB: 1
